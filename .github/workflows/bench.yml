name: benchmarks

# Manual only: a full run restarts Docker hundreds of times (ADR 0011). Results come from a
# shared GitHub-hosted runner and are labelled as noisy.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: measured runs per cell
        default: "200"

permissions:
  contents: read

env:
  UV_VERSION: 0.13.6

jobs:
  bench:
    name: benchmarks (ubuntu-24.04, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          python-version: "3.12"
      - run: uv sync --locked
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace bubblewrap
      - name: Benchmarks
        env:
          RUNS: ${{ inputs.runs }}
        run: >
          PYTHONPATH=. uv run --locked python benchmarks/bench.py run
          --env gha-ubuntu-24.04-x86_64
          --label "GitHub-hosted ubuntu-24.04 runner, x86_64 (a noisy shared VM)"
          --runs "$RUNS" --cold-runs "$RUNS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-gha-ubuntu-24.04-x86_64
          path: benchmarks/results/gha-ubuntu-24.04-x86_64.*
