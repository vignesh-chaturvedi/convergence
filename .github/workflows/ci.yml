name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy

  # Tests on the runners' own kernels. These are cloud kernels with newer Landlock ABIs than
  # stock Ubuntu 24.04, so they exercise the ABI-gated features.
  test:
    name: test (${{ matrix.runner }}, py${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.12", "3.13"]
        include:
          - runner: ubuntu-latest
            uv-sha256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          - runner: ubuntu-24.04
            uv-sha256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          - runner: ubuntu-24.04-arm
            uv-sha256: 229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kernel facts
        run: bash scripts/kernel-facts.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ matrix.uv-sha256 }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest
      - name: Doctor report
        if: always()
        run: |
          uv run --locked convergence doctor --json > doctor.json || true
          uv run --locked convergence doctor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: doctor-${{ matrix.runner }}-py${{ matrix.python }}
          path: doctor.json
          if-no-files-found: warn

  # The stock Ubuntu 24.04 kernel (6.8, Landlock ABI 4) is what a fresh 24.04 install runs,
  # but no GitHub-hosted runner uses it. Boot the pinned 24.04 cloud image in a nested
  # QEMU/KVM VM (the same Lima template as local development) and run the tests there.
  test-ga-kernel:
    name: test (Ubuntu 24.04 GA kernel, nested VM, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CONVERGENCE_USE_VM: "1"
      CONVERGENCE_VM_CPUS: "2"
      CONVERGENCE_VM_MEMORY: "4"
      LIMA_VERSION: "2.2.0"
      LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Install Lima
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o lima.tar.gz \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          echo "${LIMA_SHA256}  lima.tar.gz" | sha256sum --check --strict -
          sudo tar -C /usr/local -xzf lima.tar.gz
          rm lima.tar.gz
          limactl --version
      - run: scripts/vm.sh create
      - run: scripts/vm.sh provision
      - name: Kernel facts (guest)
        run: scripts/vm.sh facts
      - run: scripts/vm.sh sync
      - run: scripts/vm.sh test
      - name: Doctor report (guest)
        if: always()
        run: |
          scripts/vm.sh shell bash -c 'uv run --locked convergence doctor --json > doctor.json' || true
          scripts/vm.sh shell uv run --locked convergence doctor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: doctor-ubuntu-24.04-ga-kernel-nested-x86_64
          path: doctor.json
          if-no-files-found: warn

  # The escape matrix. The validity gate must pass now: every case must do what it claims
  # with nothing confining it. The confined run needs `convergence run` (Phase 4) and is
  # expected to fail until then, so it is allowed to fail; its report is still uploaded.
  escape:
    name: escape matrix (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            uv-sha256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          - runner: ubuntu-24.04
            uv-sha256: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
          - runner: ubuntu-24.04-arm
            uv-sha256: 229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ matrix.uv-sha256 }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: Holdout seal
        run: uv run --locked python -m escape.runner verify-holdout
      - name: Validity (unconfined; must pass)
        run: >
          uv run --locked python -m escape.runner validity --set dev --set controls
          --json out/validity.json --markdown out/validity.md
      - name: Confined matrix (expected to fail until Phase 4)
        continue-on-error: true
        run: >
          uv run --locked python -m escape.runner run --launcher convergence
          --set dev --set controls --json out/confined.json --markdown out/confined.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escape-${{ matrix.runner }}
          path: out/
          if-no-files-found: warn
