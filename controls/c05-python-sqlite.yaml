id: control-python-sqlite
category: control
description: Python sqlite3 creates a database in the output directory, inserts and queries.
expect: {verdict: allowed, mechanism: none (benign control)}
policy:
  version: 1
  filesystem:
    read: [/usr, /etc/ld.so.cache, "${WORKDIR}"]
    write: ["${OUT_DIR}", /dev/null]
    execute: ["${PYTHON}", {path: "${LOADER}", optional: true}]
  resources: {wall_clock_seconds: 30}
  environment:
    set: {PATH: /usr/bin:/bin, LANG: C.UTF-8}
payload:
  argv:
    - "${PYTHON}"
    - "-c"
    - |
      import pathlib, sqlite3
      marker = next(l for l in pathlib.Path("${INPUT_FILE}").read_text().splitlines() if "MARKER" in l)
      db = sqlite3.connect("${OUT_DIR}/notes.db")
      db.execute("create table notes (body text)")
      db.execute("insert into notes values (?)", (marker,))
      db.commit()
      print(db.execute("select body from notes").fetchone()[0])
oracle: {type: workload-output, require_file: true}
