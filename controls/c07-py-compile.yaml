id: control-py-compile
category: control
description: A build-like step byte-compiles a module from the project into the output directory.
expect: {verdict: allowed, mechanism: none (benign control)}
policy:
  version: 1
  filesystem:
    read: [/usr, /etc/ld.so.cache, "${WORKDIR}"]
    write: ["${OUT_DIR}", /dev/null]
    execute: ["${PYTHON}", {path: "${LOADER}", optional: true}]
  resources: {wall_clock_seconds: 30}
  environment:
    set: {PATH: /usr/bin:/bin, LANG: C.UTF-8}
payload:
  argv:
    - "${PYTHON}"
    - "-c"
    - import py_compile; py_compile.compile("${INPUT_MODULE}", cfile="${OUT_DIR}/module.pyc", doraise=True)
oracle: {type: workload-output, require_file: true}
