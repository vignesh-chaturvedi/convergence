id: control-tcp-server-allowed-port
category: control
description: A server binds the one TCP port the policy grants and answers one request.
expect: {verdict: allowed, mechanism: none (benign control)}
policy:
  version: 1
  filesystem:
    read: [/usr, /etc/ld.so.cache, "${WORKDIR}"]
    write: [/dev/null]
    execute: ["${PYTHON}", {path: "${LOADER}", optional: true}]
  network:
    tcp_bind: ["${SERVE_PORT}"]
  resources: {wall_clock_seconds: 30}
  environment:
    set: {PATH: /usr/bin:/bin, LANG: C.UTF-8}
payload:
  argv:
    - "${PYTHON}"
    - "-c"
    - |
      import socket
      server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      server.bind(("127.0.0.1", ${SERVE_PORT}))
      server.listen(1)
      server.settimeout(20)
      conn, _ = server.accept()
      conn.settimeout(5)
      conn.recv(65536)
      conn.sendall(b"HTTP/1.0 200 OK\r\nContent-Type: text/plain\r\n\r\n${SERVE_NONCE}")
      conn.close()
oracle: {type: server-reachable}
