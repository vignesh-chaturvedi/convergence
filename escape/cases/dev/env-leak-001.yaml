{
  "id": "env-leak-001",
  "category": "env-leak",
  "description": "Reads a secret from the supervisor's environment, which no policy passes on.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "supervisor",
    "min_abi": 0
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "env-leak-001.py"
  },
  "oracle": {
    "type": "env-leak"
  }
}
