{
  "id": "exec-disallowed-002",
  "category": "exec-disallowed",
  "description": "Executes a readable, non-executable marker with execveat on its open descriptor.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "landlock-fs",
    "min_abi": 1
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}",
        "${MARKER_DIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "exec-disallowed-002.py"
  },
  "oracle": {
    "type": "exec-probe",
    "marker": "elf"
  }
}
