{
  "id": "filesystem-read-002",
  "category": "filesystem-read",
  "description": "Builds the secret's path from its directory rather than using it directly.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "landlock-fs",
    "min_abi": 1
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "filesystem-read-002.py"
  },
  "oracle": {
    "type": "canary-file-read"
  }
}
