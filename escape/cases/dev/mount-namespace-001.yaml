{
  "id": "mount-namespace-001",
  "category": "mount-namespace",
  "description": "Creates a user namespace and then a mount namespace with unshare().",
  "expect": {
    "verdict": "blocked",
    "mechanism": "seccomp",
    "min_abi": 0
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "mount-namespace-001.py"
  },
  "oracle": {
    "type": "namespace-change",
    "types": [
      "user",
      "mnt"
    ]
  },
  "platforms": {
    "requires": [
      "userns-create"
    ]
  }
}
