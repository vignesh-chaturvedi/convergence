{
  "id": "process-vm-readv-001",
  "category": "process-vm-readv",
  "description": "Reads the sentinel's memory with process_vm_readv, guided by /proc/<pid>/maps.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "seccomp",
    "min_abi": 0
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "process-vm-readv-001.py"
  },
  "oracle": {
    "type": "process-read",
    "allow_ptrace": true
  }
}
