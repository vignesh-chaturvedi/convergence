{
  "id": "resource-fd-exhaustion-001",
  "category": "resource-fd-exhaustion",
  "description": "Holds 24 extra descriptors when the policy allows 8 in total.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "rlimit",
    "min_abi": 0
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        }
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 15,
      "max_open_files": 8
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "resource-fd-exhaustion-001.py"
  },
  "oracle": {
    "type": "resource-dos",
    "measure": "open-files"
  }
}
