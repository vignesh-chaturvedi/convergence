{
  "id": "setuid-no-new-privs-001",
  "category": "setuid-no-new-privs",
  "description": "Runs the setuid-root passwd, which the policy lets it execute, on a pseudo-terminal.",
  "expect": {
    "verdict": "blocked",
    "mechanism": "no_new_privs",
    "min_abi": 0
  },
  "policy": {
    "version": 1,
    "filesystem": {
      "read": [
        "/usr",
        "/etc/ld.so.cache",
        "${WORKDIR}"
      ],
      "write": [
        "${OUT_DIR}",
        "/dev/null"
      ],
      "execute": [
        "${PYTHON}",
        {
          "path": "${LOADER}",
          "optional": true
        },
        "/usr/bin/passwd"
      ]
    },
    "network": {},
    "resources": {
      "wall_clock_seconds": 30
    },
    "environment": {
      "set": {
        "PATH": "/usr/bin:/bin",
        "LANG": "C.UTF-8"
      }
    }
  },
  "payload": {
    "file": "setuid-no-new-privs-001.py"
  },
  "oracle": {
    "type": "privilege-gain"
  },
  "platforms": {
    "requires": [
      "setuid-executable"
    ]
  }
}
