id: holdout-clone3-bypass-001
category: clone3-bypass
description: Requests a mount namespace through clone3 while entering a user namespace.
expect:
  verdict: blocked
  mechanism: seccomp (ENOSYS)
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-clone3-bypass-001.py
oracle:
  type: namespace-change
  types:
  - user
  - mnt
platforms:
  requires:
  - userns-create
