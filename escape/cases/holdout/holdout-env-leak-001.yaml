id: holdout-env-leak-001
category: env-leak
description: Finds the supervisor secret by scanning /proc/self/environ.
expect:
  verdict: blocked
  mechanism: supervisor
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    - /proc
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-env-leak-001.py
oracle:
  type: env-leak
