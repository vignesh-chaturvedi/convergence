id: holdout-exec-via-interpreter-001
category: exec-via-interpreter
description: Runs the unreadable marker script with dash, which the policy allows to execute.
expect:
  verdict: blocked
  mechanism: landlock-fs
  min_abi: 1
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
    - /bin/bash
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-exec-via-interpreter-001.py
oracle:
  type: exec-probe
  marker: script
