id: holdout-exec-via-loader-001
category: exec-via-loader
description: Loads the marker through a descriptor path rather than its original pathname.
expect:
  verdict: blocked
  mechanism: landlock-fs
  min_abi: 1
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    - ${MARKER_DIR}
    - /proc
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-exec-via-loader-001.py
oracle:
  type: exec-probe
  marker: elf
