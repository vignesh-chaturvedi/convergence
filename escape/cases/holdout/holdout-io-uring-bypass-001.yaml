id: holdout-io-uring-bypass-001
category: io-uring-bypass
description: Creates a single-issuer io_uring and keeps its descriptor open for sampling.
expect:
  verdict: blocked
  mechanism: seccomp
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-io-uring-bypass-001.py
oracle:
  type: fd-kind
  kinds:
  - io_uring
platforms:
  requires:
  - io-uring
