id: holdout-net-tcp-bind-001
category: net-tcp-bind
description: Serves the marker over an IPv4-mapped connection to a dual-stack IPv6 listener.
expect:
  verdict: blocked
  mechanism: landlock-net
  min_abi: 4
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network:
    tcp_bind:
    - 9
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-net-tcp-bind-001.py
oracle:
  type: server-reachable
