id: holdout-net-tcp-connect-001
category: net-tcp-connect
description: Connects to the TCP sink with connect_ex and sends a short request.
expect:
  verdict: blocked
  mechanism: landlock-net
  min_abi: 4
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network:
    tcp_connect:
    - 9
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-net-tcp-connect-001.py
oracle:
  type: network-sink
  family: ipv4
  protocol: tcp
