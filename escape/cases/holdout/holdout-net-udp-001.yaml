id: holdout-net-udp-001
category: net-udp
description: Sends an IPv6 UDP datagram using sendmsg to the harness sink.
expect:
  verdict: blocked
  mechanism: seccomp
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-net-udp-001.py
oracle:
  type: network-sink
  family: ipv6
  protocol: udp
