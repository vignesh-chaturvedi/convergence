id: holdout-persist-setsid-doublefork-001
category: persist-setsid-doublefork
description: Uses POSIX_SPAWN_SETSID to leave a single spawned process running after the tool exits.
expect:
  verdict: blocked
  mechanism: supervisor
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-persist-setsid-doublefork-001.py
oracle:
  type: persist
