id: holdout-proc-other-pid-002
category: proc-other-pid
description: Reads the sentinel's mapped pathname from the ptrace-guarded maps file.
expect:
  verdict: blocked
  mechanism: landlock-fs + ptrace-domain
  min_abi: 1
policy:
  version: 1
  filesystem:
    read: [/usr, /etc/ld.so.cache, "${WORKDIR}", /proc]
    write: ["${OUT_DIR}", /dev/null]
    execute: ["${PYTHON}", {path: "${LOADER}", optional: true}]
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-proc-other-pid-002.py
oracle:
  type: process-read
  allow_ptrace: true
  secret_in_mapped_path: true
