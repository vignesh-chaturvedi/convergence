id: holdout-ptrace-002
category: ptrace
description: Reads the sentinel buffer with PTRACE_SEIZE and PTRACE_PEEKDATA.
expect:
  verdict: blocked
  mechanism: seccomp
  min_abi: 0
policy:
  version: 1
  filesystem:
    read: [/usr, /etc/ld.so.cache, "${WORKDIR}"]
    write: ["${OUT_DIR}", /dev/null]
    execute: ["${PYTHON}", {path: "${LOADER}", optional: true}]
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-ptrace-002.py
oracle:
  type: process-read
  allow_ptrace: true
  expose_secret_address: true
