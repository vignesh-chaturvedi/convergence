id: holdout-signal-outside-001
category: signal-outside
description: Signals the sentinel through a pidfd rather than a numeric PID.
expect:
  verdict: blocked
  mechanism: landlock-signal-scope
  min_abi: 6
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-signal-outside-001.py
oracle:
  type: process-signal
