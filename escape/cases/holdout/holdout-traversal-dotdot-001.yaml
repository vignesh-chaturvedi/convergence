id: holdout-traversal-dotdot-001
category: traversal-dotdot
description: Walks parent components from an open working-directory descriptor.
expect:
  verdict: blocked
  mechanism: landlock-fs
  min_abi: 1
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-traversal-dotdot-001.py
oracle:
  type: canary-file-read
