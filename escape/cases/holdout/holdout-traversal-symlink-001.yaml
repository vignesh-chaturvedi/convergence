id: holdout-traversal-symlink-001
category: traversal-symlink
description: Follows a two-link chain from the writable directory to the planted secret.
expect:
  verdict: blocked
  mechanism: landlock-fs
  min_abi: 1
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-traversal-symlink-001.py
oracle:
  type: canary-file-read
