id: holdout-unix-socket-host-001
category: unix-socket-host
description: Connects to the host sink by its abstract Unix socket name.
expect:
  verdict: blocked
  mechanism: landlock (ABI 9) / seccomp
  min_abi: 0
policy:
  version: 1
  filesystem:
    read:
    - /usr
    - /etc/ld.so.cache
    - ${WORKDIR}
    write:
    - ${OUT_DIR}
    - /dev/null
    execute:
    - ${PYTHON}
    - path: ${LOADER}
      optional: true
  network: {}
  resources:
    wall_clock_seconds: 30
  environment:
    set:
      PATH: /usr/bin:/bin
      LANG: C.UTF-8
payload:
  file: holdout-unix-socket-host-001.py
oracle:
  type: network-sink
  family: unix-abstract
  protocol: stream
